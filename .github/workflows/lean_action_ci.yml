name: Lean Action CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check catalog sources and renderer
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_challenge_catalog.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_challenge_catalog_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_challenge_pages.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_challenge_catalog.py --check
      - name: Render review artifact
        run: |
          python3 scripts/build_challenge_pages.py \
            --output "$RUNNER_TEMP/challenge-catalog"
      - name: Upload pull-request preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: challenge-catalog-preview-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-catalog
          if-no-files-found: error
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # PRs are keyed by number so a new revision supersedes the old merge
      # ref. Pushes are keyed by ref. For main, cancel-in-progress=false
      # deliberately retains the active run and lets the newest pending
      # checkpoint replace older pending work. This bounds the queue while
      # making that default-branch policy explicit, without making validation
      # wait for documentation or publishing.
      group: ${{ github.workflow }}-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v5
      - name: Check root imports
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_lean_imports.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_root_imports.py
      - name: Check import architecture
        run: |
          python3 scripts/check_import_architecture.py --self-test
          python3 scripts/check_import_architecture.py
      - name: Check generated OEIS tactic coverage
        run: python3 scripts/generate-oeis-tactic-coverage.py --check
      - name: Check proof status
        run: |
          python3 scripts/check_proof_status.py --self-test
          python3 scripts/check_proof_status.py
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /
      # Build cache: every run restores the newest `.lake` saved by a `main` build with the same
      # toolchain and manifest, and Lake rebuilds only what changed since.  Only pushes to `main`
      # save, so pull requests do not fill the 10 GB cache quota with entries no other run can
      # use (which evicted the `main` cache and forced full rebuilds).  The key format matches
      # lean-action's own, so existing `main` caches stay usable.
      - name: Restore build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - uses: leanprover/lean-action@v1
        with:
          # Keep the required check an explicit ordinary `lake build`, even
          # if future Lake metadata changes lean-action auto-detection.
          build: true
          build-args: ""
          # caching is done by the explicit restore/save steps around this one
          use-github-cache: false
      - name: Save build cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
      - name: Audit curated declarations
        run: |
          python3 scripts/audit_challenge_catalog.py \
            --generate "$RUNNER_TEMP/challenge-catalog-audit.lean"
          lake env lean "$RUNNER_TEMP/challenge-catalog-audit.lean" \
            > "$RUNNER_TEMP/challenge-catalog-audit.raw"
          python3 scripts/audit_challenge_catalog.py \
            --collect "$RUNNER_TEMP/challenge-catalog-audit.raw" \
            --report "$RUNNER_TEMP/challenge-catalog-audit.json"
      - name: Upload revision-specific catalog evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: challenge-catalog-audit-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-catalog-audit.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: [build, catalog]
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.build.result == 'success' && needs.catalog.result == 'success' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ github.sha }}
