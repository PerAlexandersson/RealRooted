name: Lean Action CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /
      - name: Prepare Lake cache directories
        run: |
          sudo mkdir -p /lake-cache/ai-projects/packages /lake-cache/ai-projects/build/RealRooted
          sudo chown -R "$USER:$USER" /lake-cache
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
