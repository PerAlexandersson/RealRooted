name: Lean Action CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    name: catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check catalogue sources and renderer
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_challenge_catalog.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_challenge_catalog_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_challenge_pages.py --check
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/audit_challenge_catalog.py --check
      - name: Render review artifact
        run: |
          python3 scripts/build_challenge_pages.py \
            --output "$RUNNER_TEMP/challenge-catalogue"
      - name: Upload pull-request preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: challenge-catalogue-preview-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-catalogue
          if-no-files-found: error
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      # PRs are keyed by number so a new revision supersedes the old merge
      # ref. Pushes are keyed by ref. For main, cancel-in-progress=false
      # deliberately retains the active run and lets the newest pending
      # checkpoint replace older pending work. This bounds the queue while
      # making that default-branch policy explicit, without making validation
      # wait for documentation or publishing.
      group: ${{ github.workflow }}-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v5
      - name: Check root imports
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_lean_imports.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check_root_imports.py
      - name: Check import architecture
        run: |
          python3 scripts/check_import_architecture.py --self-test
          python3 scripts/check_import_architecture.py
      - name: Check generated OEIS tactic coverage
        run: python3 scripts/generate-oeis-tactic-coverage.py --check
      - name: Check proof status
        run: |
          python3 scripts/check_proof_status.py --self-test
          python3 scripts/check_proof_status.py
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /
      - uses: leanprover/lean-action@v1
        with:
          # Keep the required check an explicit ordinary `lake build`, even
          # if future Lake metadata changes lean-action auto-detection.
          build: true
          build-args: ""
      - name: Audit curated declarations
        run: |
          python3 scripts/audit_challenge_catalog.py \
            --generate "$RUNNER_TEMP/challenge-catalogue-audit.lean"
          lake env lean "$RUNNER_TEMP/challenge-catalogue-audit.lean" \
            > "$RUNNER_TEMP/challenge-catalogue-audit.raw"
          python3 scripts/audit_challenge_catalog.py \
            --collect "$RUNNER_TEMP/challenge-catalogue-audit.raw" \
            --report "$RUNNER_TEMP/challenge-catalogue-audit.json"
      - name: Upload revision-specific catalogue evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: challenge-catalogue-audit-${{ github.sha }}
          path: ${{ runner.temp }}/challenge-catalogue-audit.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    needs: [build, catalogue]
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.build.result == 'success' && needs.catalogue.result == 'success' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      revision: ${{ github.sha }}
