name = "RealRooted"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RealRooted"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/YaelDillies/mathlib4.git"
rev = "list_interleave"

[[lean_lib]]
name = "RealRooted"
