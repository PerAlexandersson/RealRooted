name = "RealRooted"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math"]
defaultTargets = ["RealRooted", "RealRooted.Production", "RealRooted.Tactic.Examples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3
warningAsError = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[require]]
name = "LeanLGV"
git = "https://github.com/PerAlexandersson/LeanLGV.git"
rev = "dc44c677ad699305a7fc6b4790d2519c890e02d8"

[[lean_lib]]
name = "RealRooted"
