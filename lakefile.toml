name = "RealRooted"
version = "0.1.0"
license = "Apache-2.0"
keywords = ["math"]
defaultTargets = ["RealRooted", "RealRooted.Production", "RealRooted.Tactic.Examples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "LeanLGV"
git = "https://github.com/PerAlexandersson/LeanLGV.git"
rev = "622b13799d990b5a9f4a89ebb02858e504ee566a"

[[lean_lib]]
name = "RealRooted"
